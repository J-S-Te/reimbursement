            },
            "maxItems": 20,
            "uniqueItems": true
          },
          "keywords": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            },
            "maxItems": 20,
            "uniqueItems": true
          },
          "fee_type": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
          },
          "default_claim_type": {
            "type": "string",
            "enum": [
              "",
              "TRAVEL",
              "DAILY",
              "PROJECT_EXECUTION"
            ]
          },
          "priority": {
            "type": "integer",
            "minimum": 0,
            "maximum": 10000
          }
        }
      },
