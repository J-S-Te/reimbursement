            "$ref": "#/components/schemas/Money"
          },
          "tax_minor": {
            "$ref": "#/components/schemas/Money"
          }
        }
      },
      "InvoiceContent": {
        "type": "object",
        "description": "本人对原件人工确认的商品或服务明细；解析候选不可直接作为确认结果。占用或消费票据须走独立正式更正和新审批轮次。",
        "properties": {
          "lines": {
            "type": "array",
