        "description": "沿用创建日窗口和当前可见范围。分母为有真实提交Snapshot的去重单据，分子为其中存在可见真实RETURN动作的单据，同单多轮只计一次；WITHDRAW/VOID不计退回。局部权限仅统计本人可见历史任务退回，不泄漏隐藏项目动作。零分母基点显式null，非零按整数向下取整；不使用差旅异常数量。保留monthly/by_type/by_project及现有净额字段。"
      }
