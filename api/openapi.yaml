{
  "openapi": "3.0.3",
  "info": {
    "title": "报销管理 API",
    "version": "1.0.0",
    "description": "application_code=reimbursement。tenant/actor只取可信RP会话。敏感命令先按当前可见性读取成功冻结结果，再对新命令预检远端。操作body中只读状态、路由结论、总额不作为可信结论；金额使用字符串整数分。首发不支持部分付款、代报、成本中心或正式外部验真供应商。 超级管理员reimbursement_admin仍受任务受理、自审自付和会计出纳分离约束；仅当前可信expense.scope.tenant_all授予本租户全量范围，普通财务及审计范围须明确发布，平台APPLICATION授权不推导业务范围。"
  },
  "servers": [
    {
      "url": "/reimbursement/api/v1",
      "description": "统一代理"
    },
    {
      "url": "/api/v1",
      "description": "服务内部"
    }
  ],
