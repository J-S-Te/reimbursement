  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "reimbursement_session",
        "description": "默认名称，可由OIDC_SESSION_COOKIE_NAME受控配置；敏感写由运行时CSRF/会话中间件校验。"
      }
    },
    "schemas": {
      "Money": {
        "type": "string",
        "pattern": "^-?(0|[1-9][0-9]*)$",
        "description": "CNY整数分，BIGINT范围；正向费用与付款必须大于零。"
      },
      "Command": {
        "type": "object",
        "properties": {
          "command_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "expected_version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        },
        "required": [
          "command_id",
          "expected_version"
        ]
      },
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "request_id": {
            "type": "string"
          },
          "field_errors": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/FieldError"
            }
          }
        },
        "required": [
          "code",
          "message",
          "request_id"
        ]
      },
      "Allocation": {
        "type": "object",
        "properties": {
          "project_id": {
            "type": "string"
          },
          "service_item_id": {
            "type": "string"
          },
          "amount_minor": {
            "$ref": "#/components/schemas/Money"
          },
          "ratio_basis_points": {
            "type": "integer",
            "minimum": 0,
            "maximum": 10000,
            "description": "比例模式每行>0且合10000；派生零分422；受限投影不返回完整比例"
          }
        },
        "required": [
          "project_id"
        ],
        "description": "金额模式金额为权威；比例模式服务器按整数分最大余数法重算，以项目/服务项稳定排序，非零回传金额不一致拒绝。"
      },
      "InvoiceUsage": {
        "type": "object",
        "properties": {
          "invoice_id": {
            "type": "string"
          },
          "used_minor": {
            "$ref": "#/components/schemas/Money"
          }
        },
        "required": [
          "invoice_id",
          "used_minor"
        ]
      },
      "Item": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "fee_type": {
            "type": "string"
          },
          "occurred_date": {
            "type": "string",
            "format": "date"
          },
          "requested_minor": {
            "$ref": "#/components/schemas/Money"
          },
          "reason": {
            "type": "string"
          },
          "exception_reason": {
            "type": "string"
          },
          "travel_exception": {
            "type": "boolean"
          },
          "city_level": {
            "type": "string"
          },
          "grade": {
            "type": "string",
            "readOnly": true
          },
          "units": {
            "type": "integer",
            "minimum": 1
          },
          "no_invoice_reason": {
            "type": "string"
          },
          "allocations": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Allocation"
            }
          },
          "invoice_usages": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/InvoiceUsage"
            }
          },
          "standard_version_id": {
            "type": "string",
            "readOnly": true
          },
          "standard_limit_minor": {
            "$ref": "#/components/schemas/Money"
          },
          "over_standard": {
            "type": "boolean",
            "readOnly": true
          },
          "historical_tail_reason": {
            "type": "string",
            "maxLength": 2000
          },
          "historical_tail_evidence_file_ids": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "maxItems": 20
          },
          "historical_tail_applications": {
            "type": "array",
            "readOnly": true,
            "items": {
              "type": "object",
              "properties": {
                "project_id": {
                  "type": "string"
                },
                "service_item_id": {
                  "type": "string"
                },
                "reference_version": {
                  "type": "string"
                },
                "policy": {
                  "$ref": "#/components/schemas/HistoricalTailPolicy"
                },
                "termination_reasons": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                }
              }
            }
          },
          "requires_travel_facts": {
            "type": "boolean",
            "readOnly": true
          },
          "travel_confirmation": {
            "$ref": "#/components/schemas/TravelConfirmation"
          },
          "travel_assessment": {
            "type": "object",
            "readOnly": true,
            "properties": {
              "status": {
                "type": "string",
                "enum": [
                  "MATCH",
                  "MISMATCH",
                  "UNKNOWN"
                ]
              },
              "confirmed_unknown": {
                "type": "boolean"
              },
              "reason_codes": {
                "type": "array",
                "items": {
                  "type": "string"
                }
              },
              "references": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "project_id": {
                      "type": "string"
                    },
                    "service_item_id": {
                      "type": "string"
                    },
                    "reference_version": {
                      "type": "string"
                    },
                    "fact_digest": {
                      "type": "string"
                    },
                    "status": {
                      "type": "string"
                    },
                    "reason_codes": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    }
                  }
                }
              },
              "cross_check_status": {
                "type": "string",
                "enum": [
                  "NOT_REQUESTED_LEGACY",
                  "MATCH",
                  "MISMATCH",
                  "UNKNOWN"
                ]
              }
            }
          },
          "allocation_mode": {
            "type": "string",
            "enum": [
              "",
              "AMOUNT",
              "RATIO"
            ]
          },
          "allocation_rule_version": {
            "type": "string",
            "readOnly": true
          },
          "travel_declaration": {
            "$ref": "#/components/schemas/TravelDeclaration"
          },
          "transport_category": {
            "type": "string"
          },
          "accommodation_category": {
            "type": "string"
          },
          "city_code": {
            "type": "string"
          },
          "no_invoice_proof_type": {
            "type": "string"
