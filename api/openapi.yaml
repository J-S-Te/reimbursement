        "required": [
          "lines"
        ]
      },
      "InvoiceContentMapping": {
        "type": "object",
        "required": [
          "id",
          "fee_type",
          "priority"
        ],
        "description": "税码前缀与字面关键词为OR关系；优先级越大越优先，同级多个规则、部分未匹配或混合类别须人工复核。",
        "properties": {
          "id": {
            "type": "string",
