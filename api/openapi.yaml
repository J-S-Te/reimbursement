          "reason": {
            "type": "string"
          },
          "compliance_codes": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "description": "ACCOUNTANT的APPROVE执行合规复检。确定不合规原子转实际RETURN，保存原因/证据、取消剩余任务并释放本单预留；相同命令重放实际结果。权限/版本/损坏账本/外部依赖故障保留403/409/503，不转换为业务退回。"
      },
